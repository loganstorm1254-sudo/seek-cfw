<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07131a">
    <title>Seek — Connect Vector</title>
    <style>
        :root { --bg0:#07131a; --ink:#e8f2f6; --muted:#8eacba; --accent:#f0a35e; --accent-2:#3ecfb2; --line:rgba(232,242,246,.14); --err:#ff8f8f; --font:"Trebuchet MS","Segoe UI",sans-serif; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; color:var(--ink); font-family:var(--font); background:var(--bg0); }
        .bg { position:fixed; inset:0; z-index:-1; background: radial-gradient(800px 420px at 10% -8%, rgba(62,207,178,.16), transparent 60%), radial-gradient(640px 360px at 95% 0%, rgba(240,163,94,.12), transparent 55%), linear-gradient(165deg,#07131a,#0c2230 50%,#081820); }
        main { width:min(420px, calc(100% - 1.5rem)); margin:0 auto; padding:2.2rem 0 3rem; }
        .brand { margin:0; font-weight:800; font-size:2.2rem; letter-spacing:-.04em; color:var(--accent-2); }
        h1 { margin:.25rem 0 .6rem; font-size:1.35rem; }
        .hint { color:var(--muted); font-size:.92rem; margin:0 0 .85rem; }
        .card { padding:1.1rem; border:1px solid var(--line); border-radius:12px; background:rgba(8,24,32,.72); }
        label { display:block; margin:0 0 .85rem; }
        label span { display:block; margin-bottom:.3rem; font-size:.85rem; color:var(--muted); }
        input { width:100%; padding:.7rem .8rem; border-radius:.5rem; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--ink); font:inherit; }
        button { width:100%; margin-top:.35rem; padding:.85rem 1rem; border:0; border-radius:.6rem; font:inherit; font-weight:700; background:var(--accent-2); color:#04221c; cursor:pointer; }
        .status { margin-top:.85rem; color:var(--muted); min-height:1.2em; }
        .status.err { color:var(--err); }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true"></div>
    <main>
        <p class="brand">SeekAra</p>
        <h1>Connect your Vector</h1>
        <p class="hint">Phone on the <b>same Wi‑Fi</b> as Vector. Enter his IP and that Wi‑Fi name, then the Seek dashboard opens here.</p>
        <form class="card" id="f">
            <label>
                <span>Vector IP</span>
                <input id="ip" name="ip" inputmode="decimal" placeholder="192.168.42.209" autocomplete="off" required>
            </label>
            <label>
                <span>Wi‑Fi name (SSID)</span>
                <input id="ssid" name="ssid" placeholder="HomeWiFi" autocomplete="off" required>
            </label>
            <button type="submit">Open Seek</button>
            <p class="status" id="st"></p>
        </form>
        <p class="hint">If this site is on the internet (not your home Wi‑Fi), save this portal URL on Vector first: Seek dashboard → Look → Portal URL → <span id="hintUrl"></span></p>
    </main>
    <script>
        (function () {
            var el = document.getElementById('hintUrl');
            if (el) el.textContent = 'wss://' + location.host + '/vector';
            try {
                var last = JSON.parse(localStorage.getItem('seekPortalLogin') || '{}');
                if (last.ip) document.getElementById('ip').value = last.ip;
                if (last.ssid) document.getElementById('ssid').value = last.ssid;
            } catch (e) {}
            document.getElementById('f').addEventListener('submit', async function (e) {
                e.preventDefault();
                var st = document.getElementById('st');
                st.className = 'status';
                st.textContent = 'Connecting…';
                var ip = document.getElementById('ip').value.trim();
                var ssid = document.getElementById('ssid').value.trim();
                try {
                    var res = await fetch('/connect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ip: ip, ssid: ssid })
                    });
                    var j = await res.json().catch(function () { return {}; });
                    if (!res.ok) {
                        st.className = 'status err';
                        st.textContent = j.message || 'Could not connect';
                        return;
                    }
                    localStorage.setItem('seekPortalLogin', JSON.stringify({ ip: ip, ssid: ssid }));
                    sessionStorage.setItem('seekPortal', JSON.stringify({ apiRoot: '/v', ip: ip, ssid: ssid }));
                    location.href = j.redirect || '/v/seek.html';
                } catch (err) {
                    st.className = 'status err';
                    st.textContent = err.message || 'network error';
                }
            });
        })();
    </script>
</body>
</html>
